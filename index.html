<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Save the Date — Sarah & Adam</title>
  
  <!-- Google Fonts: Cormorant Garamond, Pinyon Script, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & ESSENTIAL STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-ivory: #FAF8F5;
      --paper-cream: #FFFDF9;
      --paper-warm: #F6F2EA;
      --text-main: #342E2B;
      --text-muted: #7E756D;
      --text-accent: #9B8773;
      --border-delicate: rgba(200, 186, 172, 0.4);
      --shadow-paper: 0 12px 30px -8px rgba(52, 46, 43, 0.07);
      --shadow-luxury: 0 20px 40px -10px rgba(52, 46, 43, 0.12);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-script: 'Pinyon Script', cursive;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #F2ECE4;
      font-family: var(--font-sans);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outer Device Viewport for Mobile & Desktop */
    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      position: relative;
      background: var(--bg-ivory);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-luxury);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      border-radius: 0;
    }

    @media (min-width: 481px) {
      .app-viewport {
        height: 94vh;
        border-radius: 32px;
        border: 1px solid rgba(210, 196, 180, 0.6);
      }
      body {
        background: radial-gradient(circle at 50% 30%, #F5EFE6 0%, #E6DDD0 100%);
        padding: 20px;
      }
    }

    /* Scrollbar Styling */
    .app-viewport::-webkit-scrollbar {
      width: 3px;
    }
    .app-viewport::-webkit-scrollbar-thumb {
      background: rgba(155, 135, 115, 0.25);
      border-radius: 3px;
    }

    /* CONTAINER WRAPPER */
    .main-wrapper {
      position: relative;
      width: 100%;
      min-height: 100%;
      padding: 24px 20px 48px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: 
        radial-gradient(circle at 50% 10%, rgba(255, 253, 249, 0.8) 0%, transparent 60%),
        var(--bg-ivory); 
    }

    /* TOP HEADER BAR */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      z-index: 50;
    }

    .status-badge {
      background: rgba(255, 253, 249, 0.95);
      border: 1px solid var(--border-delicate);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.4s ease;
    }

    .sound-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 253, 249, 0.95);
      border: 1px solid var(--border-delicate);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .sound-btn:active {
      transform: scale(0.92);
    }

    /* LACE FRAME & SCRATCH EXPERIENCE CONTAINER */
    .lace-experience-stage {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* BASE IMAGE: USER'S ORIGINAL LACE.PNG FRAME & HANDS PHOTO */
    .lace-frame-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: contain;
      pointer-events: none;
    }

    /* LAYER 2: SCRATCH CANVAS LAYER (CLIPPED STRICTLY INSIDE THE OVAL OF THE FRAME) */
    .scratch-canvas-container {
      position: absolute;
      width: 68%;
      height: 68%;
      top: 16%;
      left: 16%;
      border-radius: 50% / 50%;
      overflow: hidden;
      z-index: 2;
      touch-action: none;
    }

    #scratch-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #scratch-canvas:active {
      cursor: grabbing;
    }
    .canvas-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* PARTICLE DUST & SPARKLES OVERLAY */
    #dust-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* SAVE THE DATE WEDDING INVITATION PAGE (REVEALED BELOW) */
    .invitation-page {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .invitation-page.revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* TYPOGRAPHY & EMBELLISHMENTS */
    .inv-tag {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-accent);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .inv-heading-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .names-display {
      margin-bottom: 20px;
    }

    .name-primary {
      font-family: var(--font-serif);
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1.05;
    }

    .ampersand-script {
      font-family: var(--font-script);
      font-size: 48px;
      color: var(--text-accent);
      display: block;
      margin: -6px 0 -4px 0;
      font-weight: 400;
    }

    .divider-line {
      width: 60px;
      height: 1px;
      background: var(--text-accent);
      opacity: 0.4;
      margin: 18px auto;
    }

    .event-date-text {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .event-location-text {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    /* COUNTDOWN TIMER WIDGET */
    .countdown-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .timer-box {
      background: rgba(255, 253, 249, 0.9);
      border: 1px solid var(--border-delicate);
      border-radius: 12px;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-paper);
    }

    .timer-val {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1;
    }

    .timer-unit {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* DETAILS STATIONERY CARD */
    .details-card {
      width: 100%;
      background: var(--paper-cream);
      border: 1px solid var(--border-delicate);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-paper);
      text-align: center;
    }

    .details-card-title {
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .details-schedule {
      list-style: none;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .details-schedule li strong {
      color: var(--text-main);
      font-weight: 500;
    }

    /* BUTTONS SECTION */
    .actions-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-invitation-primary {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--text-main);
      color: #FAF8F5;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(52, 46, 43, 0.15);
      transition: all 0.25 ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-invitation-primary:active {
      transform: scale(0.98);
      opacity: 0.95;
    }

    .btn-row-dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-invitation-secondary {
      width: 100%;
      padding: 13px 10px;
      border-radius: 12px;
      background: var(--paper-cream);
      border: 1px solid var(--border-delicate);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-invitation-secondary:active {
      transform: scale(0.97);
      background: var(--paper-warm);
    }

    /* MODAL OVERLAY STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(52, 46, 43, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items
